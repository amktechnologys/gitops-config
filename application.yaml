apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitops-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/amktechnologys/gitops-config.git
    targetRevision: main
    path: apps/demo

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
